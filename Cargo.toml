[workspace]
resolver = "2"
members = [
    "crates/rokr",
    "crates/rokr-app",
    "crates/rokr-tui",
    "crates/rokr-core",
    "crates/rokr-provider",
    "crates/rokr-tools",
    "crates/rokr-config",
    "crates/rokr-session",
    "crates/rokr-mcp",
    "crates/rokr-hooks",
    "crates/rokr-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rokrdev/rokr"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
wiremock = "0.6"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
