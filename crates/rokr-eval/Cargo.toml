[package]
name = "rokr-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Ticket 58 (eval-case-runner-and-deterministic-assertions): depends only on
# rokr-app (not the reverse), keeping eval-only dependencies off every
# shipped binary's path -- rokr-eval is driven by `rokr eval <cases-dir>`
# but is never itself a dependency of the `rokr` TUI/headless path.
rokr-app = { path = "../rokr-app" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
# Ticket 59 (eval-llm-judge-scoring): judge.rs makes a direct minimal
# OpenAI-compatible chat-completions call rather than depending on
# rokr-provider's full Provider trait (see judge.rs's doc comment) --
# reqwest is already a workspace dependency (used by rokr-provider), so
# this adds no new external dependency to the workspace, only a new edge
# from rokr-eval to it.
reqwest = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
