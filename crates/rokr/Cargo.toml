[package]
name = "rokr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rokr-tui = { path = "../rokr-tui" }
rokr-core = { path = "../rokr-core" }
rokr-provider = { path = "../rokr-provider" }
rokr-tools = { path = "../rokr-tools" }
rokr-config = { path = "../rokr-config" }
rokr-session = { path = "../rokr-session" }
# Ticket 44 (mcp-tracer-bullet): not in the ticket's `files-touched` list,
# but mechanically required -- `main.rs`'s interim MCP wiring (also listed
# in `files-touched`) cannot call into `rokr-mcp` at all without this
# dependency edge. Flagged in the ticket report as a deviation.
rokr-mcp = { path = "../rokr-mcp" }
# Ticket 49 (hooks-tracer-bullet): not in the ticket's `files-touched` list,
# but mechanically required -- `main.rs`'s interim `ROKR_PRETOOLUSE_HOOK`
# wiring (also listed in `files-touched`) cannot call into `rokr-hooks` at
# all without this dependency edge. Same mechanical necessity as ticket
# 44's `rokr-mcp` dependency add above; flagged in the ticket report as a
# deviation, pre-authorized by the ticket brief.
rokr-hooks = { path = "../rokr-hooks" }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.9.0"
wiremock = { workspace = true }
